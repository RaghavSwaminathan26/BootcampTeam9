    .food:nth-child(3n) .float { animation-duration: 30s; animation-delay: -19s; }
    @keyframes drift {
      0%, 100% { transform: translate(-12px, 10px) rotate(-2deg); }
      33% { transform: translate(16px, -18px) rotate(2deg); }
      66% { transform: translate(-18px, -8px) rotate(-1deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .float { animation: none; }
    }
